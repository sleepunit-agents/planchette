name: plugin
# Linux and Windows build on every run. macOS builds on pushes (main and version tags), so every release has it;
# on pull requests it's optional (repository variable HOCKET_HOSTED=true). Run it by hand (Actions > plugin > Run
# workflow) for all three platforms on any branch, without publishing.
# Pushes publish downloads: main moves the rolling "nightly" pre-release, a vX.Y.Z tag cuts a release (see README).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
jobs:
  build:
    # Run trusted repository branches only.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [linux, windows, macos-latest]
        exclude: ${{ fromJSON((vars.HOCKET_HOSTED == 'true' || github.event_name != 'pull_request') && '[]' || '[{"os":"macos-latest"}]') }}
    name: build (${{ matrix.os }})
    defaults:
      run:
        shell: bash  # Use Git Bash for step scripts.
    runs-on: ${{ matrix.os == 'linux' && 'ubuntu-latest' || matrix.os == 'windows' && 'windows-latest' || matrix.os }}
    steps:
      - name: Git Bash first (a Windows box's bash may be WSL's)
        if: runner.os == 'Windows'
        # cmd: PowerShell 7 may not be installed, and Windows PowerShell's default execution policy won't run the step.
        shell: cmd
        run: echo C:\Program Files\Git\bin>>"%GITHUB_PATH%"
      - uses: actions/checkout@v4
      - name: Linux build dependencies (GitHub's runner; ours has them installed)
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libfreetype-dev libfontconfig1-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxext-dev libxcomposite-dev libgl-dev libasound2-dev xvfb
      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DHOCKET_PLUGIN=ON -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - name: Build
        shell: bash
        run: |
          targets="--target PlanchettePlugin_VST3 --target PlanchetteHostTest --target PlanchetteDocTest --target PlanchetteUiTest --target PlanchettePortTest"
          if [ "$RUNNER_OS" = macOS ]; then targets="$targets --target PlanchettePlugin_AU"; fi
          cmake --build build --config Release --parallel 4 $targets
      - name: Find the builds
        id: paths
        shell: bash
        run: |
          echo "vst3=$(find build -type d -name 'Planchette.vst3' | head -1)" >> "$GITHUB_OUTPUT"
          echo "host=$(find build -type f \( -name 'PlanchetteHostTest' -o -name 'PlanchetteHostTest.exe' \) | head -1)" >> "$GITHUB_OUTPUT"
          echo "doc=$(find build -type f \( -name 'PlanchetteDocTest' -o -name 'PlanchetteDocTest.exe' \) | head -1)" >> "$GITHUB_OUTPUT"
          echo "ui=$(find build -type f \( -name 'PlanchetteUiTest' -o -name 'PlanchetteUiTest.exe' \) | head -1)" >> "$GITHUB_OUTPUT"
          echo "port=$(find build -type f \( -name 'PlanchettePortTest' -o -name 'PlanchettePortTest.exe' \) | head -1)" >> "$GITHUB_OUTPUT"
      - name: A song survives JSON and back
        shell: bash
        run: '"${{ steps.paths.outputs.doc }}"'
      - name: The screens work under a finger
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a "${{ steps.paths.outputs.ui }}"; else "${{ steps.paths.outputs.ui }}"; fi
      - name: A MIDI port that comes and goes (skips where virtual devices can't be made)
        run: |
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a "${{ steps.paths.outputs.port }}"; else "${{ steps.paths.outputs.port }}"; fi
      - name: Plays exactly the engine's notes, as a host loads it
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a "${{ steps.paths.outputs.host }}" "${{ steps.paths.outputs.vst3 }}"
          else "${{ steps.paths.outputs.host }}" "${{ steps.paths.outputs.vst3 }}"; fi
      - name: pluginval
        shell: bash
        run: |
          # The validator for this platform (picked here, not in the matrix: an include would re-add excluded jobs).
          case "$RUNNER_OS" in
            macOS) zip=pluginval_macOS.zip bin=pluginval.app/Contents/MacOS/pluginval ;;
            Windows) zip=pluginval_Windows.zip bin=pluginval.exe ;;
            *) zip=pluginval_Linux.zip bin=pluginval ;;
          esac
          curl -sL -o pv.zip "https://github.com/Tracktion/pluginval/releases/download/v1.0.3/$zip"
          unzip -qo pv.zip -d pv
          chmod +x "pv/$bin" || true
          if [ "$RUNNER_OS" = Linux ]; then run="xvfb-run -a"; else run=""; fi
          # Skip window tests in Windows service sessions; the UI test still exercises the editor.
          gui=""
          if [ "$RUNNER_OS" = Windows ] && [ "$RUNNER_ENVIRONMENT" = self-hosted ]; then gui="--skip-gui-tests"; fi
          $run "pv/$bin" --strictness-level 8 --validate-in-process $gui --validate "${{ steps.paths.outputs.vst3 }}"
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp -R "${{ steps.paths.outputs.vst3 }}" dist/
          if [ "$RUNNER_OS" = macOS ]; then cp -R "$(find build -type d -name 'Planchette.component' | head -1)" dist/; fi
          version=$(sed -n 's/^project(planchette VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          printf 'Planchette %s\ncommit %s (%s)\nbuilt %s on %s\n' "$version" "$GITHUB_SHA" "$GITHUB_REF_NAME" \
            "$(date -u +%Y-%m-%dT%H:%MZ)" "$RUNNER_OS" > dist/BUILD.txt
          # Zip here, not in upload-artifact: an artifact drops file permissions, and a Mac bundle needs its exec bit.
          cd dist && cmake -E tar cf "../Planchette-$RUNNER_OS.zip" --format=zip -- *
      - uses: actions/upload-artifact@v4
        with:
          name: Planchette-${{ runner.os }}
          path: Planchette-${{ runner.os }}.zip

  publish:
    # Whatever platforms passed get published; a platform that failed is left out rather than holding the rest back.
    needs: build
    if: ${{ !cancelled() && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Planchette-*
          path: out
          merge-multiple: true
      - name: Anything to publish?
        run: |
          ls -la out
          ls out/Planchette-*.zip >/dev/null 2>&1 || { echo "::error::No platform built, nothing to publish"; exit 1; }
      - name: Cut a release (vX.Y.Z tag)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^project(planchette VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            "v$version"|"v$version"-*) ;;
            *) echo "::error::Tag $tag doesn't match CMakeLists.txt's VERSION $version: bump it first"; exit 1 ;;
          esac
          pre=""; case "$tag" in *-*) pre="--prerelease" ;; esac   # v0.2.0-rc1 and friends are pre-releases
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" out/Planchette-*.zip --clobber
          else
            gh release create "$tag" out/Planchette-*.zip --verify-tag --title "Planchette $tag" --generate-notes $pre
          fi
      - name: Roll the nightly (main)
        if: github.ref == 'refs/heads/main'
        run: |
          # An older run finishing late mustn't roll the nightly back.
          head=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$head" != "$GITHUB_SHA" ]; then echo "main has moved on to $head; leaving the nightly to that run"; exit 0; fi
          git tag -f nightly "$GITHUB_SHA"
          git push -f origin refs/tags/nightly
          notes="Rolling build of \`main\` at ${GITHUB_SHA:0:7}: $(git log -1 --format=%s)

          Built and validated (pluginval, host test) $(date -u '+%Y-%m-%d %H:%M UTC'). Each zip has a BUILD.txt naming its commit.
          For a cut version, take the latest release instead."
          if gh release view nightly >/dev/null 2>&1; then
            # Clear the old zips so a platform that failed this time doesn't leave a stale one behind.
            for a in $(gh release view nightly --json assets --jq '.assets[].name'); do gh release delete-asset nightly "$a" --yes; done
            gh release edit nightly --prerelease --latest=false --title "Planchette nightly" --notes "$notes"
            gh release upload nightly out/Planchette-*.zip --clobber
          else
            gh release create nightly out/Planchette-*.zip --prerelease --latest=false --title "Planchette nightly" --notes "$notes"
          fi
